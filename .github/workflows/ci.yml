name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-2025]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test research/multi-repo/test/*.test.mjs
      - run: node research/multi-repo/generate-report.mjs --check
      - run: npm run build
      - name: Smoke test built CLI (dist/cli.js)
        shell: bash
        run: |
          node dist/cli.js --version
          TMP_REPO=$(mktemp -d)
          cd "$TMP_REPO"
          git init -q -b main
          git config user.name "CI"
          git config user.email "ci@example.com"
          printf 'export const a = 1;\n' > a.ts
          git add a.ts && git commit -q -m "initial"
          BASE_SHA=$(git rev-parse HEAD)
          git checkout -q -b feature
          printf 'export const a = 2;\n' > a.ts
          git add a.ts && git commit -q -m "update a"
          node "$GITHUB_WORKSPACE/dist/cli.js" brief --base "$BASE_SHA" --no-history --out "$TMP_REPO/.gutter"
          test -f "$TMP_REPO/.gutter/gutter.json"
          test -f "$TMP_REPO/.gutter/brief.md"
          test -f "$TMP_REPO/.gutter/gutter.html"
          rm -rf "$TMP_REPO"

  dogfood:
    # Gutter briefs its own PRs using the built dist/ path.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: ./
        with:
          post: always
