name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for dry-run verification (e.g. v0.0.0-test)'
        required: true
        type: string
      dry_run:
        description: 'Verify dist/ tag build without publishing to npm or creating a GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install, verify, and build dist/
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Resolve and validate release tag
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            DRY_RUN="$INPUT_DRY_RUN"
          else
            TAG="${GITHUB_REF_NAME}"
            DRY_RUN="false"
          fi
          if [[ ! "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "error: tag '$TAG' does not match vX.Y.Z" >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          PRERELEASE="${BASH_REMATCH[2]:-}"
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "$DRY_RUN" != "true" ] && [ "$TAG" != "v${PKG_VER}" ]; then
            echo "error: tag '$TAG' does not match package.json version 'v${PKG_VER}'" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "major=v$MAJOR" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([ -n "$PRERELEASE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

      - name: Create detached-HEAD release commit with dist/ and update tags
        id: tag_dist
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          MAJOR: ${{ steps.meta.outputs.major }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          DRY_RUN: ${{ steps.meta.outputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach HEAD
          git add -f dist
          git commit -q -m "release: ${TAG} (with dist)"
          RELEASE_SHA=$(git rev-parse HEAD)
          git tag -f "$TAG" "$RELEASE_SHA"
          git push origin "refs/tags/${TAG}" --force
          if [ "$PRERELEASE" != "true" ] && [ "$DRY_RUN" != "true" ]; then
            git tag -f "$MAJOR" "$RELEASE_SHA"
            git push origin "refs/tags/${MAJOR}" --force
          fi
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish to npm with provenance
        if: ${{ steps.meta.outputs.dry_run != 'true' && steps.meta.outputs.prerelease != 'true' }}
        run: npm publish --provenance --access public

      - name: Dry-run npm pack check
        if: ${{ steps.meta.outputs.dry_run == 'true' || steps.meta.outputs.prerelease == 'true' }}
        run: npm publish --dry-run

      - name: Create GitHub Release from CHANGELOG.md
        if: ${{ steps.meta.outputs.dry_run != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          VER="${TAG#v}"
          NOTES=$(node -e '
            const fs = require("node:fs");
            const ver = process.argv[1];
            const raw = fs.readFileSync("CHANGELOG.md", "utf8");
            const escaped = ver.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const re = new RegExp(`^##\\s+v?${escaped}\\b[^\\n]*\\n([\\s\\S]*?)(?=^##\\s+|$)`, "m");
            const m = re.exec(raw);
            process.stdout.write((m && m[1] ? m[1].trim() : `Release ${ver}`) + "\n");
          ' "$VER")
          EXTRA_ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            EXTRA_ARGS+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes "$NOTES" "${EXTRA_ARGS[@]}"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "$NOTES" "${EXTRA_ARGS[@]}"
          fi
