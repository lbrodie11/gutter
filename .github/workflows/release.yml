name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to verify or release (e.g. v0.0.0-test)'
        required: true
        type: string
      dry_run:
        description: 'Verify dist/ tag build locally without pushing tags, publishing to npm, or creating a GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      major: ${{ steps.meta.outputs.major }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - name: Checkout repository (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve and validate release tag
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            DRY_RUN="$INPUT_DRY_RUN"
          else
            TAG="${GITHUB_REF_NAME}"
            DRY_RUN="false"
          fi
          if [[ ! "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "error: tag '$TAG' does not match vX.Y.Z" >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          PRERELEASE="${BASH_REMATCH[2]:-}"
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "$DRY_RUN" != "true" ]; then
            if [ "$TAG" != "v${PKG_VER}" ]; then
              echo "error: tag '$TAG' does not match package.json version 'v${PKG_VER}'" >&2
              exit 1
            fi
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "error: tag '$TAG' already exists; refusing to overwrite via workflow_dispatch" >&2
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "major=v$MAJOR" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([ -n "$PRERELEASE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

      - name: Install, verify, and build dist/
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Upload built dist/ artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Download built dist/ artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-dist
          path: dist

      - name: Create detached-HEAD release commit with dist/ and verify tree
        id: tag_dist
        shell: bash
        env:
          TAG: ${{ needs.build.outputs.tag }}
          MAJOR: ${{ needs.build.outputs.major }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          DRY_RUN: ${{ needs.build.outputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export EXISTING_TAGS="$(git tag -l)"
          git checkout --detach HEAD
          git add -f dist
          git commit --allow-empty -q -m "release: ${TAG} (with dist)"
          RELEASE_SHA=$(git rev-parse HEAD)
          git tag -f "$TAG" "$RELEASE_SHA"

          # Verify the tagged commit tree contains compiled entrypoints.
          TREE_CHECK=$(git ls-tree -r "$TAG" dist/action/main.js dist/cli.js)
          echo "$TREE_CHECK"
          echo "$TREE_CHECK" | grep -q "dist/action/main.js"
          echo "$TREE_CHECK" | grep -q "dist/cli.js"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: verified local tag $TAG ($RELEASE_SHA) contains dist/; skipping remote tag push."
            exit 0
          fi

          git push origin "refs/tags/${TAG}" --force

          MOVE_MAJOR=$(node --experimental-strip-types --input-type=module -e '
            import { shouldMoveMajorTag } from "./scripts/release-notes.ts";
            const tag = process.env.TAG ?? "";
            const existing = (process.env.EXISTING_TAGS ?? "").split(/\r?\n/).filter(Boolean);
            process.stdout.write(shouldMoveMajorTag(tag, existing) ? "true" : "false");
          ')
          if [ "$MOVE_MAJOR" = "true" ]; then
            git tag -f "$MAJOR" "$RELEASE_SHA"
            git push origin "refs/tags/${MAJOR}" --force
          else
            echo "Skipping $MAJOR update for $TAG (prerelease or older than an existing stable release)."
          fi

      - name: Dry-run npm pack check
        if: ${{ needs.build.outputs.dry_run == 'true' }}
        run: npm publish --dry-run --ignore-scripts

      - name: Publish to npm with provenance
        if: ${{ needs.build.outputs.dry_run != 'true' }}
        shell: bash
        env:
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VER} is already published on npm; skipping publish step."
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --provenance --access public --tag next --ignore-scripts
          else
            npm publish --provenance --access public --ignore-scripts
          fi

      - name: Create GitHub Release from CHANGELOG.md
        if: ${{ needs.build.outputs.dry_run != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          NOTES=$(node --experimental-strip-types --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { extractReleaseNotes } from "./scripts/release-notes.ts";
            const raw = readFileSync("CHANGELOG.md", "utf8");
            process.stdout.write(extractReleaseNotes(raw, process.env.TAG ?? "") + "\n");
          ')
          EXTRA_ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            EXTRA_ARGS+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes "$NOTES" "${EXTRA_ARGS[@]}"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "$NOTES" "${EXTRA_ARGS[@]}"
          fi
