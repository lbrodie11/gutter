name: 'Gutter: PR change briefing'
description: 'A one-page, evidence-backed briefing on every pull request: what changed, what it touches, its tests, and its history.'
author: 'Laqwan Brodie'

branding:
  icon: 'layout'
  color: 'yellow'

inputs:
  github-token:
    description: 'Token used to post the sticky PR comment. Needs pull-requests: write.'
    required: false
    default: ${{ github.token }}
  base:
    description: 'Base commit SHA or ref (defaults to the pull request base SHA).'
    required: false
    default: ''
  post:
    description: 'When to comment: auto (skip quiet PRs, update existing), always, or never (summary + artifact only).'
    required: false
    default: 'auto'
  history:
    description: 'Use Repo Archaeology co-change history ("true"/"false").'
    required: false
    default: 'true'
  calibrate:
    description: 'Backtest how reliable co-change history is on this repo ("true"/"false").'
    required: false
    default: 'true'
  max-forgotten:
    description: 'Maximum "usually changes with" pairs from co-change history to show.'
    required: false
    default: '3'
  archaeology-version:
    description: 'npm version spec of repo-archaeology. Installed into an isolated prefix under RUNNER_TEMP (cached) and loaded as a library; npx is the fallback.'
    required: false
    default: '^0.12.0'
  working-directory:
    description: 'Directory inside GITHUB_WORKSPACE to analyze.'
    required: false
    default: '.'
  upload-page:
    description: 'Upload gutter.html and gutter.json as a workflow artifact ("true"/"false").'
    required: false
    default: 'true'

outputs:
  status:
    description: 'analyzed, skipped, or error.'
    value: ${{ steps.brief.outputs.status }}
  salience:
    description: 'quiet, brief, or full.'
    value: ${{ steps.brief.outputs.salience }}
  question-count:
    description: 'Number of checklist items (facts for the reviewer).'
    value: ${{ steps.brief.outputs.question-count }}
  forgotten-count:
    description: 'Number of "usually changes with" pairs shown (co-change history, not predictions).'
    value: ${{ steps.brief.outputs.forgotten-count }}
  json-path:
    description: 'Path to gutter.json on the runner.'
    value: ${{ steps.brief.outputs.json-path }}
  html-path:
    description: 'Path to the comic page on the runner.'
    value: ${{ steps.brief.outputs.html-path }}

runs:
  using: 'composite'
  steps:
    # GU-05: repo-archaeology lives in an isolated prefix under RUNNER_TEMP, never in the user's repo.
    # One prefix per requested spec (readable name + checksum), so two steps asking for different
    # versions never share, reuse or cache each other's install.
    - id: ra-prefix
      if: ${{ inputs.history != 'false' }}
      shell: bash
      env:
        SPEC: ${{ inputs.archaeology-version }}
      run: echo "dir=${RUNNER_TEMP:-/tmp}/gutter-ra/$(printf '%s' "$SPEC" | tr -c 'A-Za-z0-9._-' '_')-$(printf '%s' "$SPEC" | cksum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

    - name: Cache repo-archaeology
      if: ${{ inputs.history != 'false' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.ra-prefix.outputs.dir }}
        key: gutter-ra-${{ runner.os }}-${{ inputs.archaeology-version }}

    - id: brief
      name: Brief this pull request
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_POST: ${{ inputs.post }}
        INPUT_HISTORY: ${{ inputs.history }}
        INPUT_CALIBRATE: ${{ inputs.calibrate }}
        INPUT_MAX_FORGOTTEN: ${{ inputs.max-forgotten }}
        INPUT_ARCHAEOLOGY_VERSION: ${{ inputs.archaeology-version }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_RA_PREFIX: ${{ steps.ra-prefix.outputs.dir }}
      run: |
        set_out() {
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            echo "$1=$2" >> "$GITHUB_OUTPUT"
          fi
        }
        if ! command -v node >/dev/null 2>&1; then
          echo "::warning::Gutter needs Node.js >= 22 on PATH (none found). Add actions/setup-node or use a runner with Node.js >= 22."
          set_out status error
          exit 0
        fi
        NODE_MAJOR=$(NODE_OPTIONS="" node -p "process.versions.node.split('.')[0]" 2>/dev/null || echo 0)
        case "$NODE_MAJOR" in
          ''|*[!0-9]*) NODE_MAJOR=0 ;;
        esac
        if [ "$NODE_MAJOR" -lt 22 ]; then
          echo "::warning::Gutter needs Node.js >= 22 on PATH (found $(node -v 2>/dev/null || echo 'unknown'))."
          set_out status error
          exit 0
        fi
        if [ ! -f "$GITHUB_ACTION_PATH/dist/action/main.js" ]; then
          echo "::warning::Gutter's built dist/action/main.js was not found in $GITHUB_ACTION_PATH. Pin to a release tag (e.g. lbrodie11/gutter@v0) or a release tag's commit SHA (not an unbuilt main branch SHA), or run 'npm run build' first."
          set_out status error
          exit 0
        fi
        # Repo Archaeology as a library (one session per brief), installed into an isolated prefix from
        # RUNNER_TEMP so the PR checkout's package.json/.npmrc are never read or written. No install scripts run.
        RA_PREFIX="${INPUT_RA_PREFIX:-}"
        RA_LIB=""
        if [ "${INPUT_HISTORY:-true}" != "false" ] && [ -n "$RA_PREFIX" ]; then
          if [ -f "$RA_PREFIX/node_modules/repo-archaeology/package.json" ]; then
            RA_LIB="$RA_PREFIX/node_modules/repo-archaeology"
          elif printf '%s' "$INPUT_ARCHAEOLOGY_VERSION" | grep -Eq '^[A-Za-z0-9.^~<>=*| -]+$' && \
            (cd "${RUNNER_TEMP:-/tmp}" && npm install --no-save --no-audit --no-fund --ignore-scripts --prefix "$RA_PREFIX" "repo-archaeology@$INPUT_ARCHAEOLOGY_VERSION" >/dev/null 2>&1) && \
            [ -f "$RA_PREFIX/node_modules/repo-archaeology/package.json" ]; then
            RA_LIB="$RA_PREFIX/node_modules/repo-archaeology"
          else
            echo "::notice::Gutter could not install repo-archaeology into $RA_PREFIX; falling back to npx."
          fi
        fi
        NODE_OPTIONS="" GUTTER_RA_LIB="$RA_LIB" node "$GITHUB_ACTION_PATH/dist/action/main.js"

    - name: Upload the comic page
      if: ${{ inputs.upload-page == 'true' && steps.brief.outputs.status == 'analyzed' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: gutter-brief
        path: |
          ${{ runner.temp }}/gutter/gutter.html
          ${{ runner.temp }}/gutter/gutter.json
        retention-days: 14
